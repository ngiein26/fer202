<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg5)"/>
  <!-- Stand base -->
  <ellipse cx="200" cy="250" rx="60" ry="16" fill="#1f2937"/>
  <rect x="194" y="170" width="12" height="80" fill="#4b5563"/>
  <!-- Mic mount U-shape -->
  <path d="M 160 140 A 40 40 0 0 0 240 140" fill="none" stroke="#6b7280" stroke-width="6"/>
  <!-- Mic capsule -->
  <rect x="175" y="80" width="50" height="90" rx="25" fill="#111827" stroke="url(#mic)" stroke-width="3"/>
  <!-- Mesh top -->
  <rect x="179" y="84" width="42" height="40" rx="20" fill="#374151"/>
  <circle cx="200" cy="145" r="5" fill="#f59e0b"/>
</svg>
