<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg4)"/>
  <!-- Watch strap -->
  <rect x="175" y="30" width="50" height="240" rx="10" fill="#1f2937"/>
  <!-- Watch case -->
  <rect x="150" y="90" width="100" height="120" rx="30" fill="#111827" stroke="#374151" stroke-width="4"/>
  <!-- Watch screen -->
  <rect x="160" y="100" width="80" height="100" rx="20" fill="#042f2e"/>
  <!-- Activity Ring -->
  <circle cx="200" cy="140" r="28" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="140" stroke-dashoffset="30"/>
  <text x="200" y="145" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">72 BPM</text>
  <text x="200" y="180" text-anchor="middle" fill="#6ee7b7" font-size="12" font-family="sans-serif">10,420 steps</text>
</svg>
